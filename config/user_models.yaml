# 用户自定义模型库配置
#
# 功能：让企业内部可以添加自己的分析模型，与内置57个模型无缝融合
#
# 支持的模型类型：
#   1. core_model：核心分析模型（如"我司SaaS评估模型"）
#   2. thinking_trap：思维陷阱检测（如"我司投资三大禁忌"）
#   3. strategy_tool：战略工具/可视化（如"竞品四象限"）
#
# 热加载：修改后自动生效（≤1秒）
#
# 文档：docs/USER_MODELS_GUIDE.md

user_models:
  # ==================== 示例1：核心分析模型 ====================
  - name: "我司SaaS评估模型"
    type: core_model
    category: "投资决策"
    when_to_use: "评估SaaS公司投资价值时使用"

    # 关键指标
    key_metrics:
      - "ARR（年度经常性收入）增速"
      - "NDR（净收入留存率）"
      - "Magic Number（营销效率）"
      - "CAC Payback Period（获客成本回收期）"
      - "Rule of 40（增长率+利润率）"

    # 输出格式
    output_format: "投资决策矩阵（投/不投/观察）+ 关键风险清单"

    # 分析维度
    analysis_dimensions:
      - "收入增长质量（ARR增速 vs NDR）"
      - "客户留存健康度（Churn vs Expansion）"
      - "获客效率（CAC Payback vs LTV/CAC）"
      - "单位经济（Gross Margin vs Burn Multiple）"
      - "产品-市场契合度（NPS vs Growth）"

    # 使用场景
    use_cases:
      - "尽调阶段快速判断"
      - "投后管理定期复盘"
      - "内部培训案例分析"

  # ==================== 示例2：思维陷阱检测 ====================
  - name: "我司投资三大禁忌"
    type: thinking_trap
    category: "投资决策"

    # 触发关键词（命中任一即触发）
    trigger_keywords:
      - "对标Uber"
      - "对标Airbnb"
      - "美国已验证"
      - "硅谷模式"
      - "重营销轻产品"
      - "盲目追热点"
      - "烧钱抢市场"

    # 警告信息
    warning_message: |
      ⚠️ 触发我司投资三大禁忌之一：

      1. 盲目对标国外成功案例（中美市场差异巨大）
      2. 重营销轻产品（违背长期价值主义）
      3. 盲目追热点（缺乏护城河）

      需重点论证：
      - 中国市场的差异化因素是什么？
      - 产品力如何？NPS多少？
      - 护城河在哪里？可持续吗？

    # 反驳路径（如何化解这个陷阱）
    counter_path: |
      如果报告中出现这些关键词，请补充：
      1. 中美市场对比分析（不同点 > 相同点）
      2. 产品力验证（用户访谈 + NPS数据）
      3. 护城河分析（网络效应/数据壁垒/品牌/成本优势）

  # ==================== 示例3：战略工具/可视化 ====================
  - name: "我司竞品分析四象限"
    type: strategy_tool
    category: "竞争分析"
    when_to_use: "内部竞品分析、战略规划会议"

    # 维度定义
    dimensions:
      x_axis: "产品力（功能完整度 × 用户体验）"
      y_axis: "市场份额（付费客户数 × GMV）"

    # 四象限定义
    quadrants:
      - name: "明星选手"
        position: "右上"
        condition: "产品力高 + 市场份额高"
        strategy: "重点关注，学习其打法"

      - name: "潜力股"
        position: "右下"
        condition: "产品力高 + 市场份额低"
        strategy: "长期观察，可能是未来威胁"

      - name: "现金牛"
        position: "左上"
        condition: "产品力低 + 市场份额高"
        strategy: "短期无威胁，但需警惕其产品升级"

      - name: "问题儿童"
        position: "左下"
        condition: "产品力低 + 市场份额低"
        strategy: "忽略，不值得关注"

    # 数据来源
    data_sources:
      - "艾瑞/易观等第三方报告"
      - "客户访谈反馈"
      - "试用竞品PRD"

    # 输出格式
    output_format: "四象限散点图 + 各象限玩家清单 + 战略建议"

  # ==================== 你的自定义模型（从这里开始添加） ====================

