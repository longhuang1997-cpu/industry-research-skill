framework_decision_tree:
  version: "0.1.0-alpha"
  last_updated: "2026-09-11"

  # 象限1: 政府主导+高监管+政府支付
  quadrant_1_gov_dominant:
    examples:
      - 长护险
      - 公立医院
      - 基础教育

    frameworks:
      - name: "PEST分析"
        weight: "40%"
        focus: "政策环境（P维度权重最高）"

      - name: "政策时间线"
        weight: "30%"
        focus: "政策演进+未来预判"

      - name: "行业链分析"
        weight: "20%"
        focus: "政府-机构-服务方三层"

      - name: "资金流向分析"
        weight: "10%"
        focus: "财政补贴路径"

    key_questions:
      - 政策窗口期何时？
      - 如何拿到定点资格？
      - 政府支付标准如何制定？

  # 象限2: 政策驱动+高监管+混合支付（医疗陪护所在）
  quadrant_2_policy_driven:
    examples:
      - 医疗陪护
      - 民办教育
      - 养老服务

    frameworks:
      - name: "PEST分析"
        weight: "30%"
        focus: "政策+经济双维度"

      - name: "行业链分析"
        weight: "25%"
        focus: "上游·要素供给 → 中游·服务运营 → 下游·需求与支付"

      - name: "四方决策链"
        weight: "25%"
        focus: "需求方-支付方-决策方-使用方"

      - name: "单位经济模型"
        weight: "15%"
        focus: "财务可行性"

      - name: "关键控制点分析"
        weight: "5%"
        focus: "谁掌握话语权？"

    key_questions:
      - 谁是真正的决策方？
      - 如何获得推荐/转介绍？
      - 政策红利期有多长？

  # 象限3: B端支付+轻监管
  quadrant_3_b2b:
    examples:
      - 企业SaaS
      - 企业培训
      - B2B服务

    frameworks:
      - name: "波特五力"
        weight: "30%"
        focus: "竞争格局"

      - name: "行业链分析"
        weight: "25%"
        focus: "产业链上下游"

      - name: "单位经济模型"
        weight: "25%"
        focus: "LTV/CAC比值"

      - name: "客户决策流程"
        weight: "15%"
        focus: "采购决策链"

      - name: "增长模型"
        weight: "5%"
        focus: "T2D3增长曲线"

    key_questions:
      - 客户获取成本（CAC）是多少？
      - 客户生命周期价值（LTV）是多少？
      - 如何缩短销售周期？

  # 象限4: 市场主导+低监管+C端直付
  quadrant_4_market_driven:
    examples:
      - 家政服务
      - 外卖平台
      - 在线教育

    frameworks:
      - name: "波特五力"
        weight: "35%"
        focus: "竞争格局+替代品威胁"

      - name: "单位经济模型"
        weight: "30%"
        focus: "LTV/CAC+复购率"

      - name: "行业链分析"
        weight: "20%"
        focus: "供给侧+需求侧"

      - name: "增长黑客"
        weight: "10%"
        focus: "AARRR漏斗"

      - name: "留存分析"
        weight: "5%"
        focus: "次日/次周/次月留存"

    key_questions:
      - 如何降低获客成本？
      - 如何提升复购率？
      - 价格战如何避免？
