data_source_tree:
  version: "0.1.0-alpha"
  last_updated: "2026-09-11"

  # 按行业大类组织数据源
  by_industry_category:

    医疗健康:
      tier1_sources:
        - name: "国家卫健委"
          url: "http://www.nhc.gov.cn/"
          search_pattern: "{关键词} site:nhc.gov.cn"
          data_types:
            - 政策文件
            - 行业统计
            - 规划文件

        - name: "国家医保局"
          url: "http://www.nhsa.gov.cn/"
          search_pattern: "{关键词} site:nhsa.gov.cn"
          data_types:
            - 医保政策
            - 基金支出
            - 定点机构

        - name: "中国卫生统计年鉴"
          url: "http://www.nhc.gov.cn/mohwsbwstjxxzx/tjtjnj/"
          data_types:
            - 医疗卫生机构数
            - 床位数
            - 人员数

        - name: "中国统计年鉴（卫生篇）"
          url: "http://www.stats.gov.cn/sj/ndsj/"
          data_types:
            - 医疗支出
            - 老龄化数据

      tier2_sources:
        - name: "券商研报"
          providers:
            - 中金公司
            - 中信证券
            - 国泰君安
          search_pattern: "{行业名}行业研究 filetype:pdf"

        - name: "中国医师协会"
          url: "http://www.cmda.net/"
          data_types:
            - 行业动态
            - 培训标准

      standard_search_keywords:
        - "{行业}市场规模 site:stats.gov.cn"
        - "{行业}政策文件 site:nhc.gov.cn"
        - "{行业}基金支出 site:nhsa.gov.cn"
        - "{行业}人均支出 统计年鉴"

      sub_industries:
        医疗陪护:
          specific_keywords:
            - "陪护服务市场规模"
            - "护理员数量 统计"
            - "长期护理保险 基金支出"
            - "医院陪护 政策"

          key_data_points:
            - name: "市场规模"
              expected_source: "统计年鉴 or 券商研报"
              tier: 2

            - name: "长护险基金支出"
              expected_source: "国家医保局"
              tier: 1

            - name: "护理员数量"
              expected_source: "卫生统计年鉴"
              tier: 1

            - name: "平均工资"
              expected_source: "人社部 or 统计年鉴"
              tier: 1

    养老服务:
      tier1_sources:
        - name: "民政部"
          url: "http://www.mca.gov.cn/"
          search_pattern: "{关键词} site:mca.gov.cn"
          data_types:
            - 养老机构数
            - 床位数
            - 政策文件

        - name: "中国统计年鉴（人口篇）"
          url: "http://www.stats.gov.cn/sj/ndsj/"
          data_types:
            - 老龄化率
            - 60岁以上人口
            - 预期寿命

      tier2_sources:
        - name: "中国社会福利与养老服务协会"
          url: "http://www.cswsf.org.cn/"

        - name: "券商研报"
          providers:
            - 中金公司
            - 中信证券

      standard_search_keywords:
        - "养老服务市场规模 site:mca.gov.cn"
        - "老龄化数据 site:stats.gov.cn"
        - "养老床位 统计"

      sub_industries:
        居家养老:
          specific_keywords:
            - "居家养老服务 政策"
            - "社区养老 市场规模"

        养老院:
          specific_keywords:
            - "养老机构数量 统计"
            - "养老院入住率"

    教育培训:
      tier1_sources:
        - name: "教育部"
          url: "http://www.moe.gov.cn/"
          search_pattern: "{关键词} site:moe.gov.cn"

        - name: "中国教育统计年鉴"
          url: "http://www.moe.gov.cn/jyb_sjzl/moe_560/"

      tier2_sources:
        - name: "中国教育学会"
        - name: "券商研报"

      standard_search_keywords:
        - "{行业}市场规模 教育部"
        - "{行业}政策 site:moe.gov.cn"

    企业服务:
      tier1_sources:
        - name: "上市公司财报"
          platforms:
            - 巨潮资讯网
            - 上交所
            - 深交所

        - name: "IPO招股书"

      tier2_sources:
        - name: "SaaS行业报告"
          providers:
            - 艾瑞咨询
            - 易观分析

        - name: "创投媒体"
          platforms:
            - 36氪
            - 钛媒体

      standard_search_keywords:
        - "{公司名}财报"
        - "{行业} IPO招股书"
        - "{行业}市场规模 艾瑞"
