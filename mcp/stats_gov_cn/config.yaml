# 国家统计局MCP服务器配置

server:
  name: "stats-gov-cn"
  version: "0.1.0"
  description: "国家统计局数据查询服务"

# 数据源配置
data_sources:
  primary:
    name: "国家统计局"
    url: "http://data.stats.gov.cn"
    api_base: "http://data.stats.gov.cn/easyquery.htm"

  fallback:
    name: "本地数据库"
    path: "./cache/stats_data.db"

# 行业代码映射表
industry_codes:
  # 医疗健康
  医疗陪护: "Q8400"
  医疗服务: "Q8400"
  养老服务: "Q8500"

  # 教育
  在线教育: "P8200"
  教育培训: "P8200"

  # 金融
  金融科技: "J6800"
  互联网金融: "J6800"

  # 制造业
  新能源汽车: "C3600"
  智能制造: "C3500"

  # 信息技术
  云计算: "I6500"
  人工智能: "I6500"
  大数据: "I6500"

# 缓存配置
cache:
  enabled: true
  ttl: 86400  # 24小时
  max_size: 1000
  storage: "memory"  # memory 或 disk

# 爬虫配置
crawler:
  user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36"
  timeout: 10
  retry: 3
  delay: 2  # 请求间隔（秒）

  # 代理配置（可选）
  proxy:
    enabled: false
    http: ""
    https: ""

# 日志配置
logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: "./logs/stats_gov_cn.log"
