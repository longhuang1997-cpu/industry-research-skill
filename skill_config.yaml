# Industry Research Skill - 配置文件

skill:
  name: industry-research
  version: 0.3.0
  description: AI驱动的咨询级行业研究工具

# 模型配置
model:
  # 模型提供商: anthropic, openai, azure, custom
  provider: anthropic

  # 模型ID
  # 留空则自动使用当前Claude Code会话的模型
  # 用户也可以手动指定：claude-opus-5, claude-sonnet-5, gpt-4等
  model: ""

  # API密钥（可选：留空则从环境变量读取）
  # 优先级：这里的配置 > 环境变量 > Claude Code settings.json
  api_key: ""  # ⚠️ 已删除明文密钥，请使用环境变量 ANTHROPIC_API_KEY

  # API Base URL（可选：用于中转站或自定义端点）
  base_url: "https://bobdong.cn"

  # 生成参数
  max_tokens: 2048
  temperature: 0.7

# 路径配置
paths:
  skill_root: "."
  output: "output"
  charts: "output/charts"

# 研究配置
research:
  # 默认模式: quick | full
  default_mode: quick

  # 快速模式配置
  quick:
    focus_areas: ["政策环境", "市场规模", "商业模式"]
    max_charts: 5

  # 全量模式配置
  full:
    focus_areas: ["政策环境", "市场规模", "商业模式", "竞争格局", "进入壁垒"]
    max_charts: 15

# 远程调用配置（用于技能市场、workbuddy等平台）
remote:
  # 是否启用远程调用模式
  enabled: false

  # 远程调用认证密钥（可选）
  auth_token: ""

  # 回调URL（可选）
  callback_url: ""
